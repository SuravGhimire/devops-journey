services:

  postgres:

    image: postgres:17

    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: saurav
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: devopsdb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    
