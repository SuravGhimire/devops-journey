services:

  web:

    build: .

    ports:
      - "5000:5000"

    depends_on:
      - postgres

  postgres:

    image: postgres:17

    environment:
      POSTGRES_USER: saurav
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: devopsdb

    volumes:
      - postgres-data:/var/lib/postgresql/data

  adminer:

    image: adminer

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:

  postgres-data:
